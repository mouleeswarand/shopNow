apiVersion: v1
kind: Service
metadata:
  name: jenkins-metrics
  namespace: monitoring
  labels:
    app: jenkins-metrics
spec:
  ports:
    - name: metrics
      port: 9105
      targetPort: 9105
---
apiVersion: v1
kind: Endpoints
metadata:
  name: jenkins-metrics
  namespace: monitoring
subsets:
  - addresses:
      - ip: 172.31.1.114
    ports:
      - name: metrics
        port: 9105
        protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jenkins-metrics
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: jenkins-metrics
  endpoints:
    - port: metrics
      path: /prometheus/
      interval: 30s
